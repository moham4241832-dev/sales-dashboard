name: Update dashboard from Excel

# The site is published by GitHub Pages directly from the main branch.
# This workflow only refreshes the data when the XLSX_URL secret (OneDrive link) is set.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      XLSX_URL: ${{ secrets.XLSX_URL }}
    steps:
      - name: Skip when no OneDrive link is set
        if: env.XLSX_URL == ''
        run: echo "XLSX_URL secret not set - nothing to do"
      - uses: actions/checkout@v4
        if: env.XLSX_URL != ''
      - uses: actions/setup-python@v5
        if: env.XLSX_URL != ''
        with:
          python-version: '3.12'
      - name: Download Excel from OneDrive and rebuild data
        if: env.XLSX_URL != ''
        run: |
          pip install pandas openpyxl
          python build_data.py download
          python build_data.py build
      - name: Save updated data
        if: env.XLSX_URL != ''
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Update sales data" && git push; fi
